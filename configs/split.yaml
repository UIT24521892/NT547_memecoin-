# Temporal split (PLAN Mục 5.3, sinh viên duyệt 2026-11-12).
# Mọi ngày là UTC; khoảng [start, end] tính cả hai đầu, theo ngày cutoff.
# Feature chỉ dùng dữ liệu <= cutoff. Nhãn chỉ dùng dữ liệu trong (cutoff, cutoff + horizon].

version: 1
seed: 20261112

horizon_days: 30              # H
min_history_days: 7           # token mới: cutoff = ngày đầu có >= 7 ngày giao dịch đầy đủ
feature_lookback_days: 14     # dữ liệu tối thiểu trước cutoff đầu tiên

# Dữ liệu OHLCV sớm nhất cần có (T0 - 14 ngày). GeckoTerminal free chỉ trả 180 ngày,
# nên phải thu trước khoảng 2026-11-22 (PLAN Mục 5.3).
data_start: 2026-05-26

sets:
  train:
    cutoff_start: 2026-06-09  # T0
    cutoff_end: 2026-07-13    # nhãn muộn nhất 2026-08-12
  validation:
    cutoff_start: 2026-08-13  # T1
    cutoff_end: 2026-08-30    # nhãn muộn nhất 2026-09-29
  test:
    cutoff_start: 2026-09-30  # T2
    cutoff_end: 2026-10-23    # T3; nhãn muộn nhất 2026-11-22. Chạy MỘT lần cuối.

# Khoảng đệm >= H giữa các tập; token có cutoff rơi vào đây bị loại và phải báo số lượng.
gaps:
  - [2026-07-14, 2026-08-12]
  - [2026-08-31, 2026-09-29]

# Token có từ trước T0 (chủ yếu nhóm C): gán ngẫu nhiên 1 cutoff trong 3 tập bằng `seed`.
# Nhóm C không dùng để train, không tính vào chỉ số chính (PLAN Mục 4.1).
group_c_in_training: false

# Liệt kê pool ứng viên (task 2, 2026-11-12, đề xuất; không phải tham số PLAN).
# Ngày tạo pool được quét = [cutoff_start - min_history - buffer, cutoff_end - min_history] của mỗi tập,
# kẹp từ data_start. Pool tạo ngoài các khoảng này sẽ có cutoff rơi vào khoảng đệm nên vốn bị loại.
discovery:
  late_activation_buffer_days: 7     # đệm cho token cần > 7 ngày mới đủ 7 ngày giao dịch
  # Base: dRPC chỉ 100 block/lần nên chọn ngẫu nhiên ngày (sinh viên chọn 2026-11-12); chuỗi khác quét mọi ngày.
  sampled_days:
    base: {train: 9, validation: 5, test: 6}


# Xếp nhóm mẫu (PLAN Mục 4.1, duyệt 2026-11-12). Chỉ dùng nến <= cutoff.
sampling:
  # Nhóm A: giá đóng tại cutoff >= 2 lần giá đóng của ngày giao dịch đầy đủ đầu tiên.
  group_a_min_price_ratio: 2.0
  # "Ngày giao dịch đầy đủ" = nến ngày UTC sau ngày tạo pool, có close và volume_usd > 0 (đề xuất 2026-11-12).
  full_day_min_volume_usd: 0
  # Lọc "còn hoạt động tại cutoff" (sinh viên chọn phương án (a) 2026-11-13): chỉ nhận token có volume
  # trung bình >= ngưỡng trong `active_window_days` ngày lịch kết thúc ở cutoff (gồm cutoff). Ngày không có
  # nến tính volume 0 vì không có giao dịch (khác quy tắc rug pull trong thresholds.yaml). Chỉ dùng nến <= cutoff.
  # Ngưỡng $1.000 là đề xuất, neo theo mốc "volume < $1.000" của LPI trong paper (§5.3.1, tr. 3941);
  # độ nhạy $100 và $10.000 phải báo cáo. Chỉ được xem lại trên train/validation.
  active_window_days: 7
  active_min_mean_volume_usd: 1000
  # Token mới (EVM): contract tạo không sớm hơn N ngày trước ngày tạo pool. Loại token cũ có pool mới
  # (USDC, WBTC, LST, meme cũ như PEPE). Thông tin biết ngay lúc tạo pool nên không rò rỉ (đề xuất 2026-11-12).
  # Solana: mint tạo trên pump.fun nên mặc định là token mới.
  new_token_max_age_days: 7
  # Phân bổ mỗi nhóm A/B theo số ngày cutoff của tập (sinh viên chọn 2026-11-12), phần dư lớn nhất.
  per_group_per_chain: 40
  # Trần sàng lọc OHLCV mỗi chuỗi (sinh viên chọn 2026-11-12): thiếu A thì báo số thật, không nới ngưỡng.
  screening_budget_pools: 5000
  # Trần riêng theo chuỗi (ghi đè trần chung). Ethereum 10.000 (sinh viên đồng ý 2026-11-13): sau 925 pool
  # chỉ ~0,7% token đủ điều kiện, 5.000 pool dự kiến thiếu B. Vẫn đi tiếp đúng thứ tự xáo cũ nên 5.000 pool
  # đầu cho kết quả y như trước. Lọc trước giúp phần thêm gần như không tốn lượt GeckoTerminal.
  screening_budget_pools_by_chain:
    ethereum: 10000
  # Lọc trước bằng số ngày có log Swap (2026-11-13, sinh viên đồng ý làm): bỏ qua GeckoTerminal với pool
  # chắc chắn < min_history_days ngày có swap trong (ngày tạo, cutoff_end muộn nhất]. Pool bị loại vẫn tính
  # vào trần sàng lọc → tập chọn giống hệt khi không lọc. Chỉ Ethereum: Base (dRPC) bị giới hạn 100 block/lần
  # nên quét từng pool không khả thi.
  prefilter_swap_days_chains: [ethereum]
