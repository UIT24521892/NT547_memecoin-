# Cấu hình chuỗi và nguồn dữ liệu (PLAN Mục 6). Không chứa key: key đọc từ .env.
# `verified`: ngày đã gọi thử thành công; null = chưa thử, không được giả định là đúng.
# Giới hạn đo thực tế: MEMORY.md Mục 4.

version: 1

common:
  ohlcv:
    provider: geckoterminal
    base_url: https://api.geckoterminal.com/api/v2
    max_requests_per_minute: 10       # Swagger ~10/phút, FAQ 30/phút (2026-10-01). Thử 20 ngày 2026-11-13: 89/180 lần là 429, 200 chỉ 10,1/phút → giữ 10
    max_candles_per_request: 1000
    lookback_days_free: 180           # đo 2026-11-06: quá 180 ngày trả 401
  user_agent: nt547-student-research

ethereum:
  chain_id: 1
  sample_size: 100
  logs:
    provider: blockscout
    base_url: https://api.blockscout.com/1/api   # cần BLOCKSCOUT_API_KEY
    key_env: BLOCKSCOUT_API_KEY
    max_rows_per_request: 1000
    max_requests_per_second: 5        # gói free 100.000 credit/ngày; dashboard 2026-11-13: ~20 credit/lần gọi → ~5.000 lần/ngày
    creation_batch_size: 10            # số địa chỉ/lần getcontractcreation; thử thật 2026-11-13: 5 và 10 đều trả đủ
    verified: 2026-11-12
  quote_tokens:
    WETH: "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2"
    ETH_native: "0x0000000000000000000000000000000000000000"   # chỉ có ở V4 (Currency 0 = ETH gốc)
  factories:
    - name: uniswap_v2
      address: "0x5C69bEe701ef814a2B6a3EDD4B1652CB9cc5aA6f"
      event_topic0: "0x0d3648bd0f6ba80134a33ba9275ac585d9d315f0ad8355cddefde31afa28d0e9"  # PairCreated
      verified: 2026-11-12            # 167 pool ngày 2026-06-10
    - name: uniswap_v3
      address: "0x1F98431c8aD98523631AE4a59f267346ea31F984"
      event_topic0: "0x783cca1c0412dd0d695e784568c96da2e9c22ff989357a2e8b1d9b2b4e6b7118"  # PoolCreated
      verified: 2026-11-12            # collector: 17 log ngày 2026-06-10
    - name: uniswap_v4
      address: "0x000000000004444c5dc75cB358380D2e3dE08A90"
      event_signature: "Initialize(bytes32,address,address,uint24,int24,address,uint160,int24)"
      # V4: một PoolManager cho mọi pool; "pool_address" là PoolId (bytes32), không phải contract.
      # Nguồn: developers.uniswap.org/docs/protocols/v4/deployments + v4-core IPoolManager.sol (đọc 2026-11-12).
      # Initialize(PoolId indexed id, Currency indexed currency0, Currency indexed currency1,
      #            uint24 fee, int24 tickSpacing, IHooks hooks, uint160 sqrtPriceX96, int24 tick)
      verified: 2026-11-12            # 376 Initialize ngày 2026-06-10 (167 ghép ETH gốc); GeckoTerminal tra được PoolId

base:
  chain_id: 8453
  sample_size: 100
  logs:
    provider: drpc
    base_url: https://lb.drpc.live/base   # + "/<key>"; cần DRPC_API_KEY
    key_env: DRPC_API_KEY
    max_block_range: 100              # đo 2026-11-12: 114 đã lỗi, dù thông báo ghi 10.000
    max_requests_per_second: 1.9      # đo tuần tự 20 lần
    multi_address: true               # 1 lần gọi lọc được nhiều address + nhiều topic
    verified: 2026-11-12
    note: "Blockscout bỏ Base khỏi gói free từ 2026-10-01 (HTTP 402)"
  block_time_seconds: 2               # khớp timestamp block 47130126 = 2026-06-09T23:59:59Z
  quote_tokens:
    WETH: "0x4200000000000000000000000000000000000006"
    ETH_native: "0x0000000000000000000000000000000000000000"   # chỉ có ở V4
  factories:
    - name: uniswap_v2
      address: "0x8909Dc15e40173Ff4699343b6eB8132c65e18eC6"
      event_topic0: "0x0d3648bd0f6ba80134a33ba9275ac585d9d315f0ad8355cddefde31afa28d0e9"
      verified: 2026-11-12            # 3 pool trong 100 block đầu ngày 2026-06-10
    - name: uniswap_v3
      address: "0x33128a8fC17869897dcE68Ed026d694621f6FDfD"
      event_topic0: "0x783cca1c0412dd0d695e784568c96da2e9c22ff989357a2e8b1d9b2b4e6b7118"
      verified: 2026-11-12            # collector: 2 log trong block 47130126–47131125
    - name: aerodrome
      address: "0x420DD381b31aEf6683db6B902084cB0FFECe40Da"
