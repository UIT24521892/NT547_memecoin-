      # V4: một PoolManager cho mọi pool; "pool_address" là PoolId (bytes32), không phải contract.
      # Nguồn: developers.uniswap.org/docs/protocols/v4/deployments + v4-core IPoolManager.sol (đọc 2026-11-12).
      # Initialize(PoolId indexed id, Currency indexed currency0, Currency indexed currency1,
